<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/theme.js"></script>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/site-header.css" />
    <link rel="stylesheet" href="/site-footer.css" />
    <link rel="stylesheet" href="/content/content.css" />
    <title>Page not found | Immio</title>
    <style>
      .notfound {
        flex: 1 0 auto;
        max-width: 34rem;
        width: 100%;
        margin: 0 auto;
        padding: 5rem 1.25rem 6rem;
        text-align: center;
      }
      .notfound__code {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--content-text-faint, #8a8f98);
        margin: 0 0 0.75rem;
      }
      .notfound h1 {
        font-size: clamp(1.6rem, 4vw, 2.25rem);
        margin: 0 0 0.75rem;
      }
      .notfound p:not(.notfound__code) {
        font-size: clamp(1rem, 2vw, 1.15rem);
        color: var(--content-text-muted, #6d6d6d);
        margin: 0 0 2rem;
      }
      .notfound__links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      .notfound__links a {
        display: inline-block;
        padding: 0.6rem 1.1rem;
        border-radius: 999px;
        border: 1px solid #e0e0e0;
        font-weight: 600;
        font-size: 1rem;
        text-decoration: none;
        color: inherit;
      }
      .notfound__links a:first-child {
        background: #007aff;
        border-color: #007aff;
        color: #fff;
      }
    </style>
  </head>

  <body>
    <div class="content">
      <header class="site-header is-scrolled">
        <div class="site-header__inner">
          <a class="site-header__logo" href="/" aria-label="Immio home">
            <img class="site-header__logo-icon" src="/logo.svg" alt="" width="36" height="36" />
            <img class="site-header__logo-wordmark" src="/logo_name.svg" alt="Immio" />
          </a>
          <nav id="site-header-menu" class="site-header__links" aria-label="Primary">
            <a class="site-header__link" href="/#features">Features</a>
            <a class="site-header__link" href="/#how-it-works">How it works</a>
            <a class="site-header__link" href="/#faq">FAQ</a>
            <a class="site-header__link" href="/rules">Rule Guide</a>
          </nav>
          <div class="site-header__actions">
            <button type="button" class="site-header__theme" aria-label="Switch color mode">
              <svg
                class="site-header__theme-icon site-header__theme-icon--moon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
              <svg
                class="site-header__theme-icon site-header__theme-icon--sun"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
                focusable="false"
              >
                <circle cx="12" cy="12" r="5" />
                <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
              </svg>
            </button>
            <a
              class="site-header__cta"
              href="https://apps.apple.com/gb/app/tax-residency-tracker-immio/id6747927306"
              data-app-download
              data-app-source="404"
              target="_blank"
              rel="noopener noreferrer"
              >Get the app</a
            >
          </div>
        </div>
      </header>

      <main class="notfound">
        <p class="notfound__code">Error 404</p>
        <h1>We couldn't find that page</h1>
        <p>The link may be out of date, or the page may have moved.</p>
        <div class="notfound__links">
          <a href="/">Go back home</a>
          <a
            href="https://apps.apple.com/gb/app/tax-residency-tracker-immio/id6747927306"
            data-app-download
            data-app-source="404"
            target="_blank"
            rel="noopener noreferrer"
            >Get the app</a
          >
          <a href="/rules">Rule Guide</a>
        </div>
      </main>

      <footer class="site-footer">
        <div class="site-footer__inner">
          <div>
            <p class="site-footer__contact-label">Contact us</p>
            <a class="site-footer__email" href="mailto:support@immio.app">support@immio.app</a>
          </div>
          <div class="site-footer__cols">
            <div class="site-footer__col">
              <a class="site-footer__link" href="/terms">Terms</a>
              <a class="site-footer__link" href="/privacy">Privacy Policy</a>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <script>
      (function () {
        /* TEMPORARY: Android downloads are paused -- keep the App Store href on
           every device. Flip ANDROID_STORE_ENABLED (src/react-app/appStoreLinks.ts)
           and this flag back together to restore Play links. */
        var ANDROID_STORE_ENABLED = false;
        if (!ANDROID_STORE_ENABLED) return;
        if (!/Android/i.test(navigator.userAgent || "")) return;
        document.querySelectorAll("a[data-app-download]").forEach(function (anchor) {
          anchor.setAttribute("href", "https://play.google.com/store/apps/details?id=com.immio.app");
        });
      })();
    </script>
  </body>
</html>
